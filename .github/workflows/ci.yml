name: ci

# Every port's suite with its coverage floor, then the cross-language validation gate. Branch protection
# requires the `ci-ok` job, which only passes when everything above it did.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # release.yml runs the whole suite before it publishes anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage floor (82% total, which counts cmd/ and examples/ at 0%; raise it, never lower it)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 82.0) ? 0 : 1 }' || { echo "::error::Go coverage ${total}% is below the 82% floor"; exit 1; }

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --cov   # floor is fail_under in pyproject.toml

  python-minimums:
    # the job above always gets the newest pyjwt and cryptography; this one pins each to the minimum
    # pyproject.toml declares, on the oldest supported Python, so a floor that no longer works fails here
    name: python minimums
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Pin the declared minimums
        run: |
          python - <<'PY'
          import re, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          pins = [re.sub(r"\s*>=\s*", "==", d.split(";")[0]) for d in deps]
          bad = [p for p in pins if "==" not in p]
          if bad:
              raise SystemExit(f"every runtime dependency needs a >= minimum: {bad}")
          open("minimums.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins))
          PY
      - run: python -m pip install -c minimums.txt -e '.[test]'
      - run: python -m pytest

  typescript:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage   # thresholds in vitest.config.ts

  java:
    name: java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify   # jacoco floors are in pom.xml

  validation:
    name: validation agreement + feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: python -m pip install pyjwt cryptography
      - run: python3 scripts/features.py --check   # README and explainer match docs/features.json
      - run: python3 scripts/version.py check      # every copy of the version matches VERSION
      - run: ./verify-validation.sh

  interop:
    name: interop (Java AS-side verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip unless the verifier is available
        run: |
          # verify-interop.sh needs client-attestation 0.1.0, which is not on Maven Central, so it cannot
          # run here yet. Run it locally before every release.
          echo "::warning title=interop gate skipped::verify-interop.sh needs the AS-side verifier (client-attestation 0.1.0), which is not published. Run ./verify-interop.sh locally before releasing."

  ci-ok:
    name: ci-ok
    if: always()
    needs: [go, python, python-minimums, typescript, java, validation]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v['result']!='success']; print('failed:', bad) if bad else print('all passed'); sys.exit(1 if bad else 0)"
