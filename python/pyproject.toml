[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "client-attestation-sdk"
version = "0.2.0"
description = "Client-side builder SDK for OAuth Attestation-Based Client Authentication"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ID Partners Pty Ltd" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/ID-Partners/client-attestation-sdk"
Source = "https://github.com/ID-Partners/client-attestation-sdk/tree/main/python"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5"]
# Optional integrations. The core never imports these at module load; each is imported only by the
# feature that needs it.
httpx = ["httpx>=0.24"]          # ClientAttestation.httpx_auth()
requests = ["requests>=2.28"]    # ClientAttestation.requests_auth() is a requests auth hook
aws = ["boto3"]                  # AwsWebIdentitySvidSource (sts:GetWebIdentityToken)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
client_attestation_sdk = ["py.typed"]
token_validator = ["py.typed"]
authz_challenge = ["py.typed"]

[tool.coverage.run]
source = ["client_attestation_sdk", "token_validator", "authz_challenge"]

[tool.coverage.report]
# today's measured coverage; raise it, never lower it
fail_under = 94
