[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "client-attestation-sdk"
version = "1.0.1"
description = "Client-side builder SDK for OAuth Attestation-Based Client Authentication"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ID Partners Pty Ltd" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pyjwt>=2.10",  # older to_jwk can drop a leading zero byte from an EC x or y
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/ID-Partners/client-attestation-sdk"
Source = "https://github.com/ID-Partners/client-attestation-sdk/tree/main/python"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5"]
# Optional integrations. The core never imports these at module load; each is imported only by the
# feature that needs it.
httpx = ["httpx>=0.24"]          # ClientAttestation.httpx_auth()
requests = ["requests>=2.28"]    # ClientAttestation.requests_auth() is a requests auth hook
aws = ["boto3"]                  # AwsWebIdentitySvidSource (sts:GetWebIdentityToken)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
client_attestation_sdk = ["py.typed"]

[tool.coverage.run]
source = ["client_attestation_sdk"]

[tool.coverage.report]
# today's measured coverage; raise it, never lower it
fail_under = 95
